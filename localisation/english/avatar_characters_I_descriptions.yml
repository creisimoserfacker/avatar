l_english:

FIR_SOZIN_DESC:0 "Sozin’s reign has ushered in perhaps the greatest transformation the Fire Nation has seen since its unification. Flourishing trade, immense industrial growth, and unprecedented cooperation with the world’s foremost scholars and inventors elevated the Fire Nation into the most technologically advanced power on the planet. To Sozin, this prosperity was not merely a triumph for his people, but a gift meant to be shared with the rest of the world.\n\nCommanding the mightiest navy ever assembled, Sozin set his ambitions outward, seeking to spread Fire Nation culture and influence across foreign shores. His expansion into the western territories of the Earth Kingdom was ultimately halted by his oldest friend, Avatar Roku, whose intervention forced the Fire Lord to abandon his campaign. Yet with Roku’s death, the world has entered a dangerous age of uncertainty. The next Avatar has yet to be found, and without anyone capable of opposing him, Sozin’s ambitions may reignite at any moment should he choose to pursue them once more."

EAR_ZAIFENG_DESC:0 "Like many Earth Kings before him, Zaifeng’s reign has been defined by the constant struggle to preserve the unity of the vast Earth Kingdom. In his youth, he was confronted by Fire Lord Sozin’s unlawful occupation of the western provinces. Unwilling to risk open war against the immensely powerful Fire Nation, Zaifeng was forced to stand aside and leave the crisis to Avatar Roku’s intervention. Now, Zaifeng faces the endless burdens that accompany rule over the largest nation in the world: an inefficient and bloated bureaucracy, the increasingly independent Dai Li, raiders and bandits that plague the Si Wong Desert, and tribal conflicts simmering along the distant frontiers of the kingdom. Yet beyond these familiar troubles looms a far greater threat.\n\nReports of unusual Fire Nation naval movements have reignited fears of another invasion—one the Earth Kingdom may be no more prepared to withstand than it was decades ago. As tensions rise across the coasts, all eyes remain fixed upon Earth King Zaifeng, who must balance the competing needs of his countless subjects while safeguarding the kingdom from the specter of foreign conquest."

PIR_GUNDAO_DESC:0 "Gold, weapons, rare scrolls, priceless artifacts, if it has ever crossed the sea aboard a ship, chances are Gundao has stolen it. Commanding a sprawling pirate fleet across the Eastern Sea, the infamous raider has built his fortune through ruthless maritime plunder, funneling stolen goods into the shadowy bazaars and black markets of distant port towns, where they are sold for quite reasonable prices. Neither flag nor nation grants protection upon his waters. Merchant vessels of the Earth Kingdom, Fire Nation convoys, and even Water Tribe traders have all fallen prey to Gundao’s raids. To sailors across the world, his name has become synonymous with fear, for wherever the horizon darkens with unfamiliar sails, the pirate lord is never far behind."

CHN_WANG_DESC:0 "Though Chin the Conqueror’s empire collapsed centuries ago, the remnants of his clan remain isolated near the place of his death. Tao stands as the latest heir entrusted with preserving the legacy of Chin’s fallen dominion and continuing the generations old blood feud with Kyoshi Island. At first glance, Tao could easily blend into the surrounding population were it not for his military uniform and the surprising charisma he carries. Within the insular culture of the Chin Clan, conformity is valued above all else, with strict devotion to ancestral customs and holidays, deep faith in tradition, and unwavering commitment to its unusual system of justice defining everyday life. Like every ruler of Qinchao before him, Tao speaks often of restoring Chin’s legacy. With each proclamation comes the same enduring promise passed down through generations, that one day Kyoshi Island will finally face the punishment the clan believes it is owed."